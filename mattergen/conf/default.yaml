hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: False
#checkpoint_path: /lustre/orion/lrn070/proj-shared/patxi/jaime/mattergen/outputs/singlerun/2026-07-21/11-46-34/checkpoints/last.ckpt
trainer_backend: native_ddp

defaults:
  - data_module: OMat24-v2
  - trainer: default
  - native_trainer: default
  - model_module: default
  - model_module/diffusion_module: default
  - model_module/diffusion_module/model: mattergen
  - model_module/diffusion_module/corruption: default
  # For each property embedding, we need to add a reference to it in the model_module.diffusion_module.model.property_embeddings list.
  # - /model_module/diffusion_module/model/property_embeddings@model_module.diffusion_module.model.property_embeddings.force_rms: force_rms
  # - /model_module/diffusion_module/model/property_embeddings@model_module.diffusion_module.model.property_embeddings.chemical_system: chemical_system

